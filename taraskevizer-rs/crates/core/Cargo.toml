[package]
name = "taraskevizer"
version = "11.0.4"
edition = "2021"
rust-version = "1.73"
description = "Belarusian orthography converter (Narkamauka → Taraskevica)"
license = "MIT"
repository = "https://github.com/GooseOb/taraskevizer"
homepage = "https://gooseob.github.io/taraskevizer/"
documentation = "https://gooseob.github.io/taraskevizer/"
readme = "../../../README.md"
keywords = ["belarusian", "taraskevica", "orthography", "transliteration", "text-processing"]
categories = ["text-processing"]

[dependencies]
regex = "1"
memchr = "2.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
fancy-regex = "0.14"
rayon = "1"

[lints]
workspace = true
